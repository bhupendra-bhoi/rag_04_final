# === OpenRouter variant (auto-derived from the Groq emanual config) ===
# Identical retrieval/generation settings; only the LLM provider is swapped to
# OpenRouter so this sweep can run in a SEPARATE notebook, in parallel with the
# Groq run, without sharing Groq's rate limit. Keys come from OPENROUTER_API_KEY
# (comma-separated for rotation). Model: meta-llama/llama-3.3-70b-instruct
#   - append ':free' to the model for the no-cost route (heavily rate-limited)
#   - keep as-is (paid credits) to actually avoid rate limits

mode: dev
name: emanual_or_v3_embed_bge

# OFAT (embedder): IDENTICAL to v1_baseline except MiniLM-L6 (384d) -> BAAI/
# bge-base-en-v1.5 (768d). Isolates the effect of a stronger dense retriever on
# short, clean manual text.

cache:
  enabled: true
  cache_dir: ./cache

log_level: INFO

providers:
  openrouter:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    params:
      cooldown_seconds: 60

chunking:
  type: fixed_word
  config:
    max_words: 128
    overlap_words: 20

embedding:
  type: sentence_transformer
  config:
    model_name: BAAI/bge-base-en-v1.5
    dimension: 768

vector_store:
  type: faiss
  config:
    dimension: 768

retrieval:
  search:
    searches:
      - type: dense
        config:
          top_k: 5

generation:
  strategy: default
  provider: openrouter
  config:
    model: meta-llama/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 512
    system_prompt: |
      You are a consumer-electronics product-support assistant. Answer questions
      about device features and settings using ONLY the provided user-manual passages.

      CRITICAL RULES:
      1. Answer ONLY from the passages provided. Do not use outside knowledge.
      2. Give exact, step-by-step instructions. Preserve menu paths, button names,
         setting names, and on-screen labels verbatim
         (e.g. "Settings > Support > Self Diagnosis > Signal Information").
      3. Be concise and procedural - give the steps, not background.
      4. If the passages do not contain the answer, respond with exactly:
         "The passages do not provide sufficient information to answer this question."
      5. Every step must be directly supported by the passages provided.
    user_prompt: |
      Passages:
      {context}

      Question: {query}

      Answer (from passages only, give exact steps and menu paths):

evaluation:
  type: trace
  provider: openrouter
  config:
    model: meta-llama/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 2000
