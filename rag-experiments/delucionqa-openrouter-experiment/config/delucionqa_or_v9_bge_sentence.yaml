# === delucionqa (automotive owner-manual QA) - OpenRouter variant ===
# Clean short manual snippets, 3 docs/question, terse questions, dense relevance
# (median 2 relevant docs of 3). noop parser (no Title/Passage). All LLM calls
# go through OpenRouter so this can run in its own notebook alongside the
# others. Keys: OPENROUTER_API_KEY (comma-separated to rotate).
# Model: meta-llama/llama-3.3-70b-instruct (append ':free' for no-cost/rate-limited).

mode: dev
name: delucionqa_or_v9_bge_sentence

# Combined OFAT winners: v3 (bge-base embedder) and v4 (sentence chunking) each
# independently beat v1_baseline across all three customer-support subsets
# (techqa/emanual/delucionqa) in the first sweep, but were only ever tested one
# factor at a time. This config stacks both changes on top of the plain
# dense-only baseline (no hybrid/rerank/query-transform) to check whether the
# gains actually compound, before it's considered as the universal
# customer-support config candidate.

cache:
  enabled: true
  cache_dir: ./cache_openrouter_delucionqa

log_level: INFO

providers:
  openrouter:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    params:
      cooldown_seconds: 60

chunking:
  type: sentence
  config:
    max_words: 150
    overlap_sentences: 1

embedding:
  type: sentence_transformer
  config:
    model_name: BAAI/bge-base-en-v1.5
    dimension: 768

vector_store:
  type: faiss
  config:
    dimension: 768

retrieval:
  search:
    searches:
      - type: dense
        config:
          top_k: 5

generation:
  strategy: default
  provider: openrouter
  config:
    model: meta-llama/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 512
    system_prompt: |
      You are an automotive owner's-manual support assistant. Answer questions
      about vehicle features, controls, and procedures using ONLY the provided
      owner's-manual passages.

      CRITICAL RULES:
      1. Answer ONLY from the passages provided. Do not use outside knowledge.
      2. Give exact, step-by-step procedures. Preserve exact control names, button
         names, warning/CAUTION text, and feature labels verbatim.
      3. Include any safety warnings (WARNING/CAUTION) that the passages attach to
         the procedure.
      4. Be concise and procedural - give the steps, not background.
      5. If the passages do not contain the answer, respond with exactly:
         "The passages do not provide sufficient information to answer this question."
      6. Every claim must be directly supported by the passages provided.
    user_prompt: |
      Passages:
      {context}

      Question: {query}

      Answer (from passages only, give exact steps, control names, and any safety warnings):

evaluation:
  type: trace
  provider: openrouter
  config:
    model: meta-llama/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 2000
