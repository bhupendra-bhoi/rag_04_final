# === OpenRouter variant (auto-derived from the Groq techqa config) ===
# Identical retrieval/generation settings; only the LLM provider is swapped to
# OpenRouter so this techqa sweep can run in its own notebook, in parallel with
# the Groq run. Keys from OPENROUTER_API_KEY (comma-separated to rotate).
# Model: meta-llama/llama-3.3-70b-instruct (append ':free' for the no-cost, rate-limited route; keep
# as-is with paid credits to avoid limits).

mode: dev
name: techqa_or_v10_hyde_match

# Cross-dataset consistency fix: v7/v8 here used step_back, while emanual/
# delucionqa's v7/v8 used HyDE — so "v7 vs v8" wasn't the same experiment
# across datasets and any 3-way comparison involving those slots was comparing
# apples to oranges. This config is an EXACT clone of v7_stepback (same
# bge-base embedder, same hybrid dense+sparse retrieval, same RRF fusion
# top_k=20, same cross-encoder rerank top_k=8) with query_transform swapped
# from step_back to hyde, using the identical hyde hyperparams (temperature
# 0.2, max_tokens 256) that emanual_or_v8_hyde / delucionqa_or_v8_hyde use.
# This gives all three datasets a directly comparable "HyDE on top of
# hybrid+rerank" data point, isolating the query-transform choice as the only
# cross-dataset variable.

cache:
  enabled: true
  cache_dir: ./cache

log_level: INFO

providers:
  openrouter:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    params:
      cooldown_seconds: 60

chunking:
  type: fixed_word
  config:
    max_words: 200
    overlap_words: 20

embedding:
  type: sentence_transformer
  config:
    model_name: BAAI/bge-base-en-v1.5
    dimension: 768

vector_store:
  type: faiss
  config:
    dimension: 768

retrieval:
  query_transform:
    type: hyde
    provider: openrouter
    config:
      model: meta-llama/llama-3.3-70b-instruct
      temperature: 0.2
      max_tokens: 256

  search:
    searches:
      - type: dense
        config:
          top_k: 40
      - type: sparse
        config:
          top_k: 40

  fusion:
    type: rrf
    config:
      top_k: 20
      k: 60

  rerank:
    type: cross_encoder
    config:
      model_name: BAAI/bge-reranker-v2-m3
      top_k: 8

generation:
  strategy: default
  provider: openrouter
  config:
    model: meta-llama/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 750
    system_prompt: |
      You are an IBM technical-support question answering assistant.
      Your task is to answer questions using ONLY information from the retrieved
      technote passages.

      CRITICAL RULES:
      1. Answer ONLY from the passages provided. Do not use external knowledge.
      2. Include all relevant steps, error codes, product versions, APAR numbers,
         and configuration details found in the passages.
      3. Preserve exact technical identifiers (version strings, file names,
         parameter names, error messages) verbatim.
      4. Do NOT add phrases like "based on general knowledge" or hedge unnecessarily.
      5. If the passages do not contain enough information, respond with exactly:
         "The passages do not provide sufficient information to answer this question."
      6. Every claim must be directly supported by the passages provided.
    user_prompt: |
      Passages:
      {context}

      Question: {query}

      Answer (from passages only, include all relevant steps and technical details):

evaluation:
  type: trace
  provider: openrouter
  config:
    model: meta-llama/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 2000
