# === PRODUCTION CONFIG — delucionqa (automotive owner-manual subset) ===
#
# Chosen after a full ablation sweep (9 configs: baseline, embedder swap,
# chunking swap, hybrid fusion w/ and w/o rerank, HyDE, combined embedder+
# chunking) across all three customer-support subsets (techqa/emanual/
# delucionqa). The plain dense-only baseline was consistently competitive
# here (never the worst performer) and matches the config that won the
# rigorous n=100 head-to-head validation on the other two subsets — used
# here for cross-domain consistency of the production architecture.
#
# NOTE: unlike techqa/emanual, this subset's own larger-sample (n=100)
# validation run stalled on OpenRouter credit exhaustion before completing
# (see rag-experiments/delucionqa-openrouter-experiment/validation_config/).
# So "baseline is best" is confirmed at n=20-sweep level here, not yet
# re-confirmed at n=100 like the other two — worth revisiting once more
# quota/credits are available, but not a blocker to shipping this as the
# consistent, cross-domain default.
#
# Provider is swappable — set to openrouter here; swap `providers:`/
# `generation.provider`/`evaluation.provider` to `groq` (model
# llama-3.3-70b-versatile) if preferred. Credentials: OPENROUTER_API_KEY
# (comma-separate multiple keys to rotate) or GROQ_API_KEY.

mode: dev
name: delucionqa_production

cache:
  enabled: true
  cache_dir: ./cache_production

log_level: INFO

providers:
  openrouter:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    params:
      cooldown_seconds: 60

# Clean short manual snippets; docs run a bit longer than emanual's.
chunking:
  type: fixed_word
  config:
    max_words: 160
    overlap_words: 24

embedding:
  type: sentence_transformer
  config:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    dimension: 384

vector_store:
  type: faiss
  config:
    dimension: 384

retrieval:
  search:
    searches:
      - type: dense
        config:
          top_k: 5

generation:
  strategy: default
  provider: openrouter
  config:
    model: meta-llama/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 512
    system_prompt: |
      You are an automotive owner's-manual support assistant. Answer questions
      about vehicle features, controls, and procedures using ONLY the provided
      owner's-manual passages.

      CRITICAL RULES:
      1. Answer ONLY from the passages provided. Do not use outside knowledge.
      2. Give exact, step-by-step procedures. Preserve exact control names, button
         names, warning/CAUTION text, and feature labels verbatim.
      3. Include any safety warnings (WARNING/CAUTION) that the passages attach to
         the procedure.
      4. Be concise and procedural - give the steps, not background.
      5. If the passages do not contain the answer, respond with exactly:
         "The passages do not provide sufficient information to answer this question."
      6. Every claim must be directly supported by the passages provided.
    user_prompt: |
      Passages:
      {context}

      Question: {query}

      Answer (from passages only, give exact steps, control names, and any safety warnings):

evaluation:
  type: trace
  provider: openrouter
  config:
    model: meta-llama/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 2000
