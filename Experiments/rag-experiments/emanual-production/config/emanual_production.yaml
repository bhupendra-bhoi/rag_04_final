# === PRODUCTION CONFIG — emanual (consumer-electronics manual subset) ===
#
# Chosen after a full ablation sweep (up to 11 configs: baseline, embedder
# swap, chunking swap, hybrid fusion w/ and w/o rerank, HyDE, combined
# embedder+chunking, an externally-inspired wide-retrieval variant) across
# all three customer-support subsets (techqa/emanual/delucionqa), validated
# at n=100 for the top two contenders. This plain dense-only baseline beat
# the stronger BAAI/bge-base-en-v1.5 embedder once sample size went beyond
# n=20 — every added layer (hybrid fusion, reranking, HyDE, wider retrieval
# windows) either underperformed in the original sweep or lost the head-to-
# head validation. See rag-experiments/emanual-openrouter-experiment/ for
# the full ablation history.
#
# Provider is swappable — set to openrouter here; swap `providers:`/
# `generation.provider`/`evaluation.provider` to `groq` (model
# llama-3.3-70b-versatile) if preferred. Credentials: OPENROUTER_API_KEY
# (comma-separate multiple keys to rotate) or GROQ_API_KEY.

mode: dev
name: emanual_production

cache:
  enabled: true
  cache_dir: ./cache_production

log_level: INFO

providers:
  openrouter:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    params:
      cooldown_seconds: 60

# Small chunks (128 words) because emanual documents are short (median ~135
# words) — most docs become one chunk, longer ones split cleanly.
chunking:
  type: fixed_word
  config:
    max_words: 128
    overlap_words: 20

embedding:
  type: sentence_transformer
  config:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    dimension: 384

vector_store:
  type: faiss
  config:
    dimension: 384

retrieval:
  search:
    searches:
      - type: dense
        config:
          top_k: 5

generation:
  strategy: default
  provider: openrouter
  config:
    model: meta-llama/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 512
    system_prompt: |
      You are a consumer-electronics product-support assistant. Answer questions
      about device features and settings using ONLY the provided user-manual passages.

      CRITICAL RULES:
      1. Answer ONLY from the passages provided. Do not use outside knowledge.
      2. Give exact, step-by-step instructions. Preserve menu paths, button names,
         setting names, and on-screen labels verbatim
         (e.g. "Settings > Support > Self Diagnosis > Signal Information").
      3. Be concise and procedural - give the steps, not background.
      4. If the passages do not contain the answer, respond with exactly:
         "The passages do not provide sufficient information to answer this question."
      5. Every step must be directly supported by the passages provided.
    user_prompt: |
      Passages:
      {context}

      Question: {query}

      Answer (from passages only, give exact steps and menu paths):

evaluation:
  type: trace
  provider: openrouter
  config:
    model: meta-llama/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 2000
