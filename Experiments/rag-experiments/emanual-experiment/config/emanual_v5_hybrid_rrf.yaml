mode: dev
name: emanual_v5_hybrid_rrf

# OFAT (hybrid): IDENTICAL to v1_baseline except retrieval becomes hybrid
# (dense + sparse BM25) fused with RRF. BM25 helps because manual answers hinge
# on exact UI tokens - menu names, setting labels, button names
# ("Ambient Mode", "Self Diagnosis"). v5 vs v1 = hybrid effect; v5 vs v2 =
# RRF vs weighted_sum.

cache:
  enabled: true
  cache_dir: ./cache

log_level: INFO

providers:
  groq:
    type: groq
    api_key_env: GROQ_API_KEY
    params:
      cooldown_seconds: 60

chunking:
  type: fixed_word
  config:
    max_words: 128
    overlap_words: 20

embedding:
  type: sentence_transformer
  config:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    dimension: 384

vector_store:
  type: faiss
  config:
    dimension: 384

retrieval:
  search:
    searches:
      - type: dense
        config:
          top_k: 20
      - type: sparse
        config:
          top_k: 20

  fusion:
    type: rrf
    config:
      top_k: 10
      k: 60

generation:
  strategy: default
  provider: groq
  config:
    model: llama-3.3-70b-versatile
    temperature: 0.0
    max_tokens: 512
    system_prompt: |
      You are a consumer-electronics product-support assistant. Answer questions
      about device features and settings using ONLY the provided user-manual passages.

      CRITICAL RULES:
      1. Answer ONLY from the passages provided. Do not use outside knowledge.
      2. Give exact, step-by-step instructions. Preserve menu paths, button names,
         setting names, and on-screen labels verbatim
         (e.g. "Settings > Support > Self Diagnosis > Signal Information").
      3. Be concise and procedural - give the steps, not background.
      4. If the passages do not contain the answer, respond with exactly:
         "The passages do not provide sufficient information to answer this question."
      5. Every step must be directly supported by the passages provided.
    user_prompt: |
      Passages:
      {context}

      Question: {query}

      Answer (from passages only, give exact steps and menu paths):

evaluation:
  type: trace
  provider: groq
  config:
    model: llama-3.3-70b-versatile
    temperature: 0.0
    max_tokens: 2000
