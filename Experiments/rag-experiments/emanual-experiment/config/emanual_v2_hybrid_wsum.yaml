mode: dev
name: emanual_v2_hybrid_wsum

# OFAT (fusion method): IDENTICAL to v5_hybrid_rrf except fusion is weighted_sum
# (equal weights) instead of RRF. v2 vs v5 isolates weighted_sum vs RRF for
# combining dense + sparse. top_k values are small because the corpus is tiny
# (~380 deduped docs -> a few hundred chunks) and answers are short.

cache:
  enabled: true
  cache_dir: ./cache

log_level: INFO

providers:
  groq:
    type: groq
    api_key_env: GROQ_API_KEY
    params:
      cooldown_seconds: 60

chunking:
  type: fixed_word
  config:
    max_words: 128
    overlap_words: 20

embedding:
  type: sentence_transformer
  config:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    dimension: 384

vector_store:
  type: faiss
  config:
    dimension: 384

retrieval:
  search:
    searches:
      - type: dense
        config:
          top_k: 20
      - type: sparse
        config:
          top_k: 20

  fusion:
    type: weighted_sum
    config:
      top_k: 10
      # Order matches `searches` above: [dense, sparse].
      weights: [0.5, 0.5]

generation:
  strategy: default
  provider: groq
  config:
    model: llama-3.3-70b-versatile
    temperature: 0.0
    max_tokens: 512
    system_prompt: |
      You are a consumer-electronics product-support assistant. Answer questions
      about device features and settings using ONLY the provided user-manual passages.

      CRITICAL RULES:
      1. Answer ONLY from the passages provided. Do not use outside knowledge.
      2. Give exact, step-by-step instructions. Preserve menu paths, button names,
         setting names, and on-screen labels verbatim
         (e.g. "Settings > Support > Self Diagnosis > Signal Information").
      3. Be concise and procedural - give the steps, not background.
      4. If the passages do not contain the answer, respond with exactly:
         "The passages do not provide sufficient information to answer this question."
      5. Every step must be directly supported by the passages provided.
    user_prompt: |
      Passages:
      {context}

      Question: {query}

      Answer (from passages only, give exact steps and menu paths):

evaluation:
  type: trace
  provider: groq
  config:
    model: llama-3.3-70b-versatile
    temperature: 0.0
    max_tokens: 2000
