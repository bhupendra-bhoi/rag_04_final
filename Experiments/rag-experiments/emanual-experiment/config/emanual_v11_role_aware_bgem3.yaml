mode: dev
name: emanual_v11_role_aware_bgem3

# Inspired by github.com/preston-zhang-x/role-aware-rag-platform, which reports
# 90.9% HIT accuracy on this same RAGBench emanual subset (own eval metric —
# HIT/source-recall/token-F1, NOT our TRACe judge, so not directly comparable —
# but its retrieval recipe is worth porting into our own sweep). Three
# retrieval-side differences from anything we've tried so far:
#   1. Embedder: BAAI/bge-m3 (1024d) instead of bge-base-en-v1.5 (768d, our v3).
#   2. Chunking: larger, sentence-aware chunks (~500 tokens / ~100-token overlap
#      via LlamaIndex's SentenceSplitter) vs our 128-150 word chunks. Approximated
#      here with our own sentence chunker at max_words=380 / overlap_sentences=2
#      — this is a translation, not a byte-for-byte port, since their splitter
#      counts tokens and overlaps by token count, ours counts words and overlaps
#      by sentence count.
#   3. Rerank keep-window: their pipeline retrieves 40 candidates (dense+sparse
#      hybrid, RRF k=60 — identical constant to what we already use) and reranks
#      down to top_n=15, i.e. it hands the generator far more context than our
#      usual top_k=5-8.
#
# Deliberately NOT ported: their generation LLM (qwen3.5:4b, a small local model
# via Ollama) and their prompt (multilingual, cites "[Reference N]" labels). We
# keep our own llama-3.3-70b-instruct + emanual system prompt unchanged so this
# config isolates the retrieval-side recipe as an ablation against our v1-v9,
# rather than conflating it with a different generator too.

cache:
  enabled: true
  cache_dir: ./cache

log_level: INFO

providers:
  groq:
    type: groq
    api_key_env: GROQ_API_KEY
    params:
      cooldown_seconds: 60

chunking:
  type: sentence
  config:
    max_words: 380
    overlap_sentences: 2

embedding:
  type: sentence_transformer
  config:
    model_name: BAAI/bge-m3
    dimension: 1024

vector_store:
  type: faiss
  config:
    dimension: 1024

retrieval:
  search:
    searches:
      - type: dense
        config:
          top_k: 40
      - type: sparse
        config:
          top_k: 40

  fusion:
    type: rrf
    config:
      top_k: 40
      k: 60

  rerank:
    type: cross_encoder
    config:
      model_name: BAAI/bge-reranker-v2-m3
      top_k: 15

generation:
  strategy: default
  provider: groq
  config:
    model: llama-3.3-70b-versatile
    temperature: 0.0
    max_tokens: 512
    system_prompt: |
      You are a consumer-electronics product-support assistant. Answer questions
      about device features and settings using ONLY the provided user-manual passages.

      CRITICAL RULES:
      1. Answer ONLY from the passages provided. Do not use outside knowledge.
      2. Give exact, step-by-step instructions. Preserve menu paths, button names,
         setting names, and on-screen labels verbatim
         (e.g. "Settings > Support > Self Diagnosis > Signal Information").
      3. Be concise and procedural - give the steps, not background.
      4. If the passages do not contain the answer, respond with exactly:
         "The passages do not provide sufficient information to answer this question."
      5. Every step must be directly supported by the passages provided.
    user_prompt: |
      Passages:
      {context}

      Question: {query}

      Answer (from passages only, give exact steps and menu paths):

evaluation:
  type: trace
  provider: groq
  config:
    model: llama-3.3-70b-versatile
    temperature: 0.0
    max_tokens: 2000
