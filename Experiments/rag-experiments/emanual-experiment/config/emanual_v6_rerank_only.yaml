mode: dev
name: emanual_v6_rerank_only

# OFAT (reranking): IDENTICAL to v1_baseline except a cross-encoder reranker is
# added after a wider dense retrieval (top_k 20 -> rerank -> top 5). Isolates the
# effect of reranking alone. Expected to matter less than on techqa because
# emanual relevance is already denser (median 1-2 relevant docs of 3), but still
# useful for ordering the right manual snippet first.

cache:
  enabled: true
  cache_dir: ./cache

log_level: INFO

providers:
  groq:
    type: groq
    api_key_env: GROQ_API_KEY
    params:
      cooldown_seconds: 60

chunking:
  type: fixed_word
  config:
    max_words: 128
    overlap_words: 20

embedding:
  type: sentence_transformer
  config:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    dimension: 384

vector_store:
  type: faiss
  config:
    dimension: 384

retrieval:
  search:
    searches:
      - type: dense
        config:
          top_k: 20

  rerank:
    type: cross_encoder
    config:
      model_name: BAAI/bge-reranker-v2-m3
      top_k: 5

generation:
  strategy: default
  provider: groq
  config:
    model: llama-3.3-70b-versatile
    temperature: 0.0
    max_tokens: 512
    system_prompt: |
      You are a consumer-electronics product-support assistant. Answer questions
      about device features and settings using ONLY the provided user-manual passages.

      CRITICAL RULES:
      1. Answer ONLY from the passages provided. Do not use outside knowledge.
      2. Give exact, step-by-step instructions. Preserve menu paths, button names,
         setting names, and on-screen labels verbatim
         (e.g. "Settings > Support > Self Diagnosis > Signal Information").
      3. Be concise and procedural - give the steps, not background.
      4. If the passages do not contain the answer, respond with exactly:
         "The passages do not provide sufficient information to answer this question."
      5. Every step must be directly supported by the passages provided.
    user_prompt: |
      Passages:
      {context}

      Question: {query}

      Answer (from passages only, give exact steps and menu paths):

evaluation:
  type: trace
  provider: groq
  config:
    model: llama-3.3-70b-versatile
    temperature: 0.0
    max_tokens: 2000
