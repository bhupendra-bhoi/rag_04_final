# === PRODUCTION CONFIG — techqa (IBM technical-support subset) ===
#
# Chosen after a full ablation sweep (10 configs: baseline, embedder swap,
# chunking swap, hybrid fusion w/ and w/o rerank, HyDE, step_back, "kitchen
# sink" combos) across all three customer-support subsets (techqa/emanual/
# delucionqa), validated at n=100 for the top two contenders. This plain
# dense-only baseline beat every fancier alternative, including the stronger
# BAAI/bge-base-en-v1.5 embedder, once sample size went beyond n=20 — every
# added layer (hybrid fusion, reranking, query transforms, wider retrieval
# windows) either underperformed in the original sweep or lost the head-to-
# head validation. See rag-experiments/techqa-openrouter-experiment/ for the
# full ablation history.
#
# Known open limitation NOT fixed by this or any config tried: techqa's
# real (non-refusal) adherence stays near-zero regardless of retrieval
# strategy — that looks like a generation-prompt/domain issue specific to
# this subset's dense technote content, not something retrieval tuning
# resolves. Worth separate follow-up work, not a blocker to shipping this
# as the retrieval strategy.
#
# Provider is swappable — set to openrouter here; swap `providers:`/
# `generation.provider`/`evaluation.provider` to `groq` (model
# llama-3.3-70b-versatile) if preferred. Credentials: OPENROUTER_API_KEY
# (comma-separate multiple keys to rotate) or GROQ_API_KEY.

mode: dev
name: techqa_production

cache:
  enabled: true
  cache_dir: ./cache_production

log_level: INFO

providers:
  openrouter:
    type: openrouter
    api_key_env: OPENROUTER_API_KEY
    params:
      cooldown_seconds: 60

# Fixed-word chunking sized to techqa's long, section-structured technote prose.
chunking:
  type: fixed_word
  config:
    max_words: 200
    overlap_words: 20

embedding:
  type: sentence_transformer
  config:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    dimension: 384

vector_store:
  type: faiss
  config:
    dimension: 384

retrieval:
  search:
    searches:
      - type: dense
        config:
          top_k: 5

generation:
  strategy: default
  provider: openrouter
  config:
    model: meta-llama/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 750
    system_prompt: |
      You are an IBM technical-support question answering assistant.
      Your task is to answer questions using ONLY information from the retrieved
      technote passages.

      CRITICAL RULES:
      1. Answer ONLY from the passages provided. Do not use external knowledge.
      2. Include all relevant steps, error codes, product versions, APAR numbers,
         and configuration details found in the passages.
      3. Preserve exact technical identifiers (version strings, file names,
         parameter names, error messages) verbatim.
      4. Do NOT add phrases like "based on general knowledge" or hedge unnecessarily.
      5. If the passages do not contain enough information, respond with exactly:
         "The passages do not provide sufficient information to answer this question."
      6. Every claim must be directly supported by the passages provided.
    user_prompt: |
      Passages:
      {context}

      Question: {query}

      Answer (from passages only, include all relevant steps and technical details):

evaluation:
  type: trace
  provider: openrouter
  config:
    model: meta-llama/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 2000
