mode: dev
name: techqa_v8_best

# Best-of-breed combo: combines the levers expected to win from the OFAT sweep.
#   - sentence chunking (precision-oriented)
#   - strongest embedder (BAAI/bge-large-en-v1.5, 1024d)
#   - hybrid dense + sparse retrieval fused with RRF (exact-token recall)
#   - cross-encoder rerank down to a tight top 6 (needle isolation, low utilization)
#   - step_back query transform (handles long verbose questions)
# Treat this as the "kitchen sink" reference. Once the OFAT results (v3-v6) are in,
# prune any lever that did not actually help and re-run to confirm the win holds.

cache:
  enabled: true
  cache_dir: ./cache

log_level: INFO

providers:
  groq:
    type: groq
    api_key_env: GROQ_API_KEY
    params:
      cooldown_seconds: 60

chunking:
  type: sentence
  config:
    max_words: 150
    overlap_sentences: 1

embedding:
  type: sentence_transformer
  config:
    model_name: BAAI/bge-large-en-v1.5
    dimension: 1024

vector_store:
  type: faiss
  config:
    dimension: 1024

retrieval:
  query_transform:
    type: step_back
    provider: groq
    config:
      model: llama-3.3-70b-versatile
      temperature: 0.3
      max_tokens: 128

  search:
    searches:
      - type: dense
        config:
          top_k: 40
      - type: sparse
        config:
          top_k: 40

  fusion:
    type: rrf
    config:
      top_k: 20
      k: 60

  rerank:
    type: cross_encoder
    config:
      model_name: BAAI/bge-reranker-v2-m3
      top_k: 6

generation:
  strategy: default
  provider: groq
  config:
    model: llama-3.3-70b-versatile
    temperature: 0.0
    max_tokens: 750
    system_prompt: |
      You are an IBM technical-support question answering assistant.
      Your task is to answer questions using ONLY information from the retrieved
      technote passages.

      CRITICAL RULES:
      1. Answer ONLY from the passages provided. Do not use external knowledge.
      2. Include all relevant steps, error codes, product versions, APAR numbers,
         and configuration details found in the passages.
      3. Preserve exact technical identifiers (version strings, file names,
         parameter names, error messages) verbatim.
      4. Do NOT add phrases like "based on general knowledge" or hedge unnecessarily.
      5. If the passages do not contain enough information, respond with exactly:
         "The passages do not provide sufficient information to answer this question."
      6. Every claim must be directly supported by the passages provided.
    user_prompt: |
      Passages:
      {context}

      Question: {query}

      Answer (from passages only, include all relevant steps and technical details):

evaluation:
  type: trace
  provider: groq
  config:
    model: llama-3.3-70b-versatile
    temperature: 0.0
    max_tokens: 2000
