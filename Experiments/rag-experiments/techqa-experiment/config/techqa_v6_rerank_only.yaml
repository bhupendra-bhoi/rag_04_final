mode: dev
name: techqa_v6_rerank_only

# OFAT ablation: identical to v1_baseline EXCEPT a cross-encoder reranker is
# added after a wider dense retrieval (top_k 40 -> rerank -> top 5). Embedder,
# chunking, and (dense-only) retrieval are unchanged, so any lift is attributable
# to reranking alone. This is the single highest-value lever expected on techqa:
# gold labels show a median of ONE relevant document among the five, so pushing
# that needle to the top is exactly what a cross-encoder does.

cache:
  enabled: true
  cache_dir: ./cache

log_level: INFO

providers:
  groq:
    type: groq
    api_key_env: GROQ_API_KEY
    params:
      cooldown_seconds: 60

chunking:
  type: fixed_word
  config:
    max_words: 200
    overlap_words: 20

embedding:
  type: sentence_transformer
  config:
    model_name: sentence-transformers/all-MiniLM-L6-v2
    dimension: 384

vector_store:
  type: faiss
  config:
    dimension: 384

retrieval:
  search:
    searches:
      - type: dense
        config:
          top_k: 40

  rerank:
    type: cross_encoder
    config:
      model_name: BAAI/bge-reranker-v2-m3
      top_k: 5

generation:
  strategy: default
  provider: groq
  config:
    model: llama-3.3-70b-versatile
    temperature: 0.0
    max_tokens: 750
    system_prompt: |
      You are an IBM technical-support question answering assistant.
      Your task is to answer questions using ONLY information from the retrieved
      technote passages.

      CRITICAL RULES:
      1. Answer ONLY from the passages provided. Do not use external knowledge.
      2. Include all relevant steps, error codes, product versions, APAR numbers,
         and configuration details found in the passages.
      3. Preserve exact technical identifiers (version strings, file names,
         parameter names, error messages) verbatim.
      4. Do NOT add phrases like "based on general knowledge" or hedge unnecessarily.
      5. If the passages do not contain enough information, respond with exactly:
         "The passages do not provide sufficient information to answer this question."
      6. Every claim must be directly supported by the passages provided.
    user_prompt: |
      Passages:
      {context}

      Question: {query}

      Answer (from passages only, include all relevant steps and technical details):

evaluation:
  type: trace
  provider: groq
  config:
    model: llama-3.3-70b-versatile
    temperature: 0.0
    max_tokens: 2000
